name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "2"

jobs:
  test:
    name: Test ${{ matrix.name }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ startsWith(matrix.runner, 'windows') && matrix.runner || startsWith(matrix.runner, 'macos') && fromJSON('["self-hosted","kalana-macos-ci","macOS"]') || fromJSON('["kalana-ci"]') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-14
          - name: Windows
            runner: windows-latest

    steps:
      - name: Prepare a private home for the Mac job
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        shell: bash
        run: |-
          mkdir -p "$RUNNER_TEMP/ci-home"
          echo "HOME=$RUNNER_TEMP/ci-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5

      # The Linux runner ships with ~10 GB free, which our 713 MB cache restore
      # plus the cargo target dir (34 tree-sitter parsers compiled in) can
      # exceed. See v4.5.1 CI flake: "No space left on device" mid-test.
      - name: Free disk space (Linux only)
        if: matrix.name == 'Linux' && runner.environment == 'github-hosted'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Bound Linux test compilation resources
        if: matrix.name == 'Linux'
        shell: bash
        run: |
          # The full-feature library and its test harness are both large.
          # Compile one target at a time without debug artifacts; retain the
          # complete default-feature workspace tests and debug assertions.
          {
            echo 'CARGO_BUILD_JOBS=1'
            echo 'CARGO_INCREMENTAL=0'
            echo 'CARGO_PROFILE_DEV_DEBUG=0'
            echo 'CARGO_PROFILE_TEST_DEBUG=0'
          } >> "$GITHUB_ENV"
          for resource in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current \
            /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.events \
            /sys/fs/cgroup/memory/memory.limit_in_bytes; do
            if [ -r "$resource" ]; then
              printf '\n%s\n' "$resource"
              cat "$resource"
            fi
          done
          df -h . "$RUNNER_TEMP"

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          profile: minimal
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-test

      - name: Run tests
        env:
          # Match macOS/Linux's 8 MB thread-stack default; Windows MSVC's 1 MB
          # default overflows async-heavy tests with STATUS_ACCESS_VIOLATION.
          RUST_MIN_STACK: "8388608"
        run: cargo test --workspace --locked

      - name: Report Linux test resource usage
        if: always() && matrix.name == 'Linux'
        shell: bash
        run: |
          for resource in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current \
            /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.events \
            /sys/fs/cgroup/memory/memory.max_usage_in_bytes; do
            if [ -r "$resource" ]; then
              printf '\n%s\n' "$resource"
              cat "$resource"
            fi
          done
          df -h . "$RUNNER_TEMP"

  clippy:
    name: Clippy
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: kalana-ci
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          profile: minimal
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked

  msrv:
    name: MSRV
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: kalana-ci
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  fmt:
    name: Format
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: kalana-ci
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          profile: minimal
          components: rustfmt
      - run: cargo fmt --all -- --check
  feature-tiers:
    name: Compile ${{ matrix.features }} feature tier
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: kalana-ci
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: [lite, medium]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: features-${{ matrix.features }}
      - name: Compile supported feature tier
        run: cargo check --workspace --locked --no-default-features --features "${{ matrix.features }}"
  release-build:
    name: Release build and package
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: kalana-ci
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-build
      - run: cargo build --workspace --release --locked
      - name: Check CLI starts
        run: target/release/tokensave --help
      - name: Validate crate packaging
        run: cargo package --no-verify
